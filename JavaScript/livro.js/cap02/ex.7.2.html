<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2.7</title>
</head>
<body>
    <form>
    <h1>Supermercado JS</h1>

    <p>Produto: <input type="text" name="name"></p>
    <p>Preço R$: <input type="number" name="inPreco" min="0" step="0.01"></p>

    <input type="submit" value="Ver Promoção">
    </form>

    <h2></h2>
    <h3></h3>
    <script>

        const frm = document.querySelector("form")
        const resp1 = document.querySelector("h2")
        const resp2 = document.querySelector("h3")

        frm.addEventListener("submit", (e) => {

        const produto = frm.name.value
        const preco = Number(frm.inPreco.value)
        const prom = preco / 2
        const item = (preco * 2) + prom

        resp1.innerText = `${produto} - Promoção Leve 3 por R$: ${item.toFixed(2)}`
        resp2.innerText = `O 3º produto custa apenas R$: ${prom.toFixed(2)}`
        
        e.preventDefault()
        })
    </script>
</body>
</html>
