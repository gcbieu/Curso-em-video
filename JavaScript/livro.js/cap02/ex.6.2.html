<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2.6</title>
</head>
<body>
    <form>
    <h1>Lan House JS</h1>

    <p>Valor por 15min de Uso R$: <input type="number" name="inValor" min="0" step="0.01"></p>

    <p>Tempo de Uso do Cliente: <input type="number" name="inTempo" min="0"></p>

    <input type="submit" value="Calcular Valor a Pagar">
</form>

<h2></h2>

<script>
    const frm = document.querySelector("form")
    const resp1 = document.querySelector("h2")

    frm.addEventListener("submit", (e) =>{
    
    const valor = Number(frm.inValor.value)
    const tempo = Number(frm.inTempo.value)
    const total = Math.ceil(tempo/15)*valor

        resp1.innerText=`Valor a pagar R$: ${total.toFixed(2)}`
        e.preventDefault()
    })
</script>
</body>
</html>
