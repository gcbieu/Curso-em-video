<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2.4</title>
</head>
<body>
    <form>
    <h1>Restaurante JS</h1>
    <p>Buffet por Quilo R$: <input type="number" name="quilo" min="0" step="0.01" required></p>

    <p>Consumo do Cliente (gr): <input type="number" name="consumo" min="0" required></p>

    <input type="submit" value="Calcular Preço">
    </form>

    <h2></h2>

    <script>

        const frm = document.querySelector("form")
        const resp1 = document.querySelector("h2")

        frm.addEventListener ("submit", (e) => {

        const kg = Number(frm.quilo.value)
        const gr = Number(frm.consumo.value)
        const valor = (kg*gr)/1000
        resp1.innerText=`Valor a pagar R$: ${valor.toFixed(2)}`
        e.preventDefault()

        })
    </script>
</body>
</html>
