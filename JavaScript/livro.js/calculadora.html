<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <form>

    <h1>Calculadora</h1>
    
    <h2 id="visor"></h2>

    <input type="button" value="CE" class="">
    <input type="button" value="C" class="apagartudo">
    <input type="button" value="⌫" class="apagar">

    <input type="button" value="1" class="numero">
    <input type="button" value="2" class="numero">
    <input type="button" value="3" class="numero">
    <input type="button" value="4" class="numero">
    <input type="button" value="5" class="numero">
    <input type="button" value="6" class="numero">
    <input type="button" value="7" class="numero">
    <input type="button" value="8" class="numero">
    <input type="button" value="9" class="numero">

    <input type="button" value="+" name="soma">
    <input type="button" value="-" name="subtracao">
    <input type="button" value="*" name="multiplicacao">
    <input type="button" value="/" name="divisao">

    <input type="submit" value="=">

</form>

    <script>

        const visor = document.querySelector("#visor")
        const numero = document.querySelectorAll(".numero")
        const apagar = document.querySelector(".apagar")
        const apagartudo = document.querySelector(".apagartudo")
        const frm = document.querySelector("form")
        //const ope = document.querySelector("")

        numero.forEach((button) => {

            button.addEventListener("click", (e) => {
                const num = button.value
                visor.innerText += num

            })
        })        

           apagar.addEventListener("click", (e) => {
            const atual = visor.innerText
            const novo = atual.slice(0, -1)
            visor.innerText = novo
            })

            apagartudo.addEventListener("click", (e) => {
            visor.innerText = ""
            })

        frm.addEventListener("submit", (e) =>{

            e.preventDefault()
        })
    </script>
</body>
</html>
