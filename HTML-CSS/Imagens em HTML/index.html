<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens em HTML</title>
</head>

<body>
    <h1>Testando cargas de imagens</h1>
    <p>Abaixo você pode ver uma imagem:</p>
    <img src="logo.png" alt="Logo da empresa" width="200">

    <p>Podemos carregar imagens também em subpastas:</p>

    <img src="imagem/estrela_full.jpg" alt="imagem subspasta" width="200"> <!--ctrl espaço -->

    <p>Também podemos carregar imagens externas:</p>
    <img src="https://tse2.mm.bing.net/th/id/OIP.9IdEUxDu8xfhGgACrlSgfwHaEo?rs=1&pid=ImgDetMain&o=7&rm=3"
        alt="Imagem externa" width="200"> <!--url-->

</body>

</html>
