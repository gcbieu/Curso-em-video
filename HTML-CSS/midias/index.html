<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midia HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos para ver a imagem mudar de tamanho automaticamente.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="IMAGENS/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="IMAGENS/foto-m.png" type="image/png">
        <img src="IMAGENS/Sem Título-3.png" alt="Imagem dinâmica">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>vamos aprender a reproduzir áudio no HTML5</p>
    <audio preload="metadata" controls>
        <source src="midia/happy_mistake.mp3" type="audio/mpeg">
    </audio>

    <h1>Inserindo videos hospedados localmente</h1>

    <video autoplay disablepictureinpicture nocontrols muted loop width="320" height="240">

    <source src="midia/ssstwitter.com_1753133231193.mp4"  type="video/mp4"> Seu navegador não suporta o elemento <code>video</code> do HTML5.
    </video>

    <h1>Incorporando vídeos do YouTube</h1>>
     <iframe width="560" height="315" src="https://www.youtube.com/embed/L2PO0wngHKo?si=7tY17nl-vp2B4FHg&amp;controls=0&amp;start=5" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope;  picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


</body>
</html>
